# sglang-jax.sky.yaml
resources:
  accelerators: tpu-v6e-1
  accelerator_args:
    tpu_vm: True
    runtime_version: v2-alpha-tpuv6e

run: |
  rm -rf maxdiffusion
  git clone https://github.com/labyrinth-ssr/maxdiffusion.git
  cd maxdiffusion && git checkout test-umt5
  yes | bash setup.sh MODE=stable DEVICE=tpu
  source ~/maxdiffusion_venv/bin/activate
  bash setup.sh MODE=stable DEVICE=tpu
  uv pip install jaxtyping
  LIBTPU_INIT_ARGS="--xla_tpu_enable_async_collective_fusion=true --xla_tpu_enable_async_collective_fusion_fuse_all_reduce=true --xla_tpu_enable_async_collective_fusion_multiple_steps=true --xla_tpu_overlap_compute_collective_tc=true --xla_enable_async_all_reduce=true" HF_HUB_ENABLE_HF_TRANSFER=1 python simple_wan_generate.py
